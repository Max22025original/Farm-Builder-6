name: FarmBuilder
main: de.farm.FarmBuilder
version: 1.0
api-version: '1.21'
description: /farm - Farmen per Menue auswaehlen, Vorschau, Sofort-Bau ohne Materialien (nur Admins)
commands:
  farm:
    description: Oeffnet das Farm-Menue
    usage: /farm [cancel]
permissions:
  farmbuilder.use:
    description: Darf /farm benutzen
    default: op
